<style>
        .scanner-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            max-width: 280px;
            margin: 0 auto;
            border-radius: 2rem;
            overflow: hidden;
            box-shadow: 0 0 0 2000px rgba(19, 37, 28, 0.85); /* simulated dark overlay outside scanner */
        }
        .scanner-frame::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 2px solid #fc934f;
            border-radius: inherit;
            z-index: 10;
        }
        /* Corner markers */
        .corner {
            position: absolute;
            width: 32px;
            height: 32px;
            border: 4px solid #fc934f;
            z-index: 20;
        }
        .corner-tl { top: 16px; left: 16px; border-right: none; border-bottom: none; border-top-left-radius: 12px; }
        .corner-tr { top: 16px; right: 16px; border-left: none; border-bottom: none; border-top-right-radius: 12px; }
        .corner-bl { bottom: 16px; left: 16px; border-right: none; border-top: none; border-bottom-left-radius: 12px; }
        .corner-br { bottom: 16px; right: 16px; border-left: none; border-top: none; border-bottom-right-radius: 12px; }
        
        .scanning-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #fc934f;
            box-shadow: 0 0 8px #fc934f;
            animation: scan 3s linear infinite;
            z-index: 15;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>
</head>
<body class="bg-primary text-on-primary min-h-screen flex flex-col font-body-md antialiased overflow-x-hidden selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Top Navigation (Transactional intent -> no bottom nav, top nav acts as 'back') -->
<header class="w-full top-0 sticky bg-primary dark:bg-primary z-50 flex items-center justify-between px-container-margin py-stack-md">
<button aria-label="Go Back" class="flex items-center text-on-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-primary">Join Quest</h1>
<div class="w-6 h-6"></div> <!-- Spacer for flex alignment -->
</header>
<main class="flex-grow flex flex-col px-container-margin py-stack-lg gap-section-padding">
<!-- Scanner Section -->
<section class="flex flex-col items-center text-center gap-stack-lg w-full max-w-md mx-auto">
<div class="space-y-stack-sm">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-secondary-container">Scan Glyph</h2>
<p class="font-body-md text-body-md text-primary-fixed-dim">Align the sacred marker within the frame to begin your journey.</p>
</div>
<!-- Viewfinder -->
<div class="relative w-full flex justify-center mt-stack-md">
<!-- Background image simulating camera feed -->
<div class="absolute inset-0 w-full h-full object-cover rounded-3xl opacity-40 z-0" data-alt="A dark, atmospheric view through a digital camera lens, focusing on a rough-hewn stone surface with faint glowing orange geometric markings. The lighting is low and mysterious, with deep shadows and soft, warm highlights creating a sense of ancient discovery in a modern context." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAuFfuNmQaobOXSp7ysomEDMnrPL00AYmpf5vZejRRaYdbPCNBF4a52oDR9pn2tZ3huxSUbohveJ-S09jqsDrIosEh4kmnXnm7D1GFGidymrMUQ3j4WJ32m24Zb_lY063GJBROc73bwiksLcpKqG0VuXFnBTvXn9V3E5LrWai5d1GuafjSZyLektBRJnqJWiwY4ZIPM4xpZqJbAZZ9aPbXR_NESYBHv-4PuTTvR3R_WYWjgSQFNbeRi9Q')"></div>
<div class="scanner-frame bg-transparent relative z-10 flex items-center justify-center backdrop-blur-[2px]">
<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>
<div class="scanning-line"></div>
<!-- Placeholder icon inside scanner if no camera feed -->
<span class="material-symbols-outlined text-[64px] text-secondary-container/50 animate-pulse" style="font-variation-settings: 'FILL' 0;">qr_code_scanner</span>
</div>
</div>
</section>
<!-- Divider -->
<div class="flex items-center gap-4 w-full max-w-md mx-auto">
<div class="flex-1 h-px bg-primary-fixed-dim/20"></div>
<span class="font-label-sm text-label-sm text-primary-fixed-dim uppercase">Or enter manually</span>
<div class="flex-1 h-px bg-primary-fixed-dim/20"></div>
</div>
<!-- Password Entry Section -->
<section class="flex flex-col gap-stack-md w-full max-w-md mx-auto mb-stack-lg">
<div class="bg-surface-container-low/5 backdrop-blur-md border border-primary-fixed-dim/20 rounded-xl p-6 flex flex-col gap-stack-md">
<label class="font-label-md text-label-md text-secondary-fixed uppercase text-center block w-full" for="quest-code">Quest Passcode</label>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary-fixed-dim" style="font-variation-settings: 'FILL' 0;">key</span>
<input class="w-full bg-primary border border-primary-fixed-dim/30 rounded-full py-4 pl-12 pr-4 text-center font-body-lg text-body-lg text-on-primary placeholder:text-primary-fixed-dim/50 focus:outline-none focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-colors uppercase tracking-widest" id="quest-code" placeholder="Enter ancient word..." type="text"/>
</div>
<button class="w-full bg-secondary-container text-on-secondary-container font-label-md text-label-md rounded-full py-4 px-6 hover:opacity-90 active:scale-95 transition-all shadow-lg flex items-center justify-center gap-2 mt-stack-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">login</span>
                    Join
                </button>
</div>
</section>
</main>
<script>
        // Simple micro-interaction for the input field to auto-uppercase
        const inputField = document.getElementById('quest-code');
        if(inputField) {
            inputField.addEventListener('input', function(e) {
                this.value = this.value.toUpperCase();
            });
        }
    </script>
</body></html>
