<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Compass Overlay - EJAS26</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#321200",
                        "on-tertiary-container": "#a2a09b",
                        "on-tertiary-fixed": "#1c1c18",
                        "on-secondary-container": "#6d3000",
                        "tertiary-fixed-dim": "#c9c6c0",
                        "surface-tint": "#4f6358",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#d2e8d9",
                        "on-primary": "#ffffff",
                        "surface-container-low": "#f3f3f4",
                        "on-primary-container": "#90a598",
                        "surface": "#f9f9f9",
                        "tertiary": "#22221e",
                        "surface-container-highest": "#e2e2e2",
                        "tertiary-fixed": "#e6e2dc",
                        "surface-container": "#eeeeee",
                        "surface-dim": "#dadada",
                        "surface-bright": "#f9f9f9",
                        "on-background": "#1a1c1c",
                        "on-tertiary-fixed-variant": "#484743",
                        "secondary-fixed-dim": "#ffb68c",
                        "primary": "#13251c",
                        "primary-fixed-dim": "#b6ccbe",
                        "secondary-fixed": "#ffdbc9",
                        "tertiary-container": "#383733",
                        "on-primary-fixed": "#0c1f16",
                        "surface-variant": "#e2e2e2",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "secondary": "#994703",
                        "outline": "#737874",
                        "surface-container-high": "#e8e8e8",
                        "primary-container": "#283b31",
                        "on-surface": "#1a1c1c",
                        "inverse-on-surface": "#f0f1f1",
                        "inverse-primary": "#b6ccbe",
                        "outline-variant": "#c2c8c2",
                        "on-surface-variant": "#424844",
                        "on-primary-fixed-variant": "#384b40",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "inverse-surface": "#2f3131",
                        "on-secondary-fixed-variant": "#753400",
                        "secondary-container": "#fc934f",
                        "background": "#fcf8f2",
                        "on-tertiary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-padding": "48px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "gutter": "16px",
                        "unit": "8px",
                        "stack-lg": "32px",
                        "container-margin": "24px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Playfair Display"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-xl": ["Playfair Display"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Playfair Display"],
                        "headline-md": ["Playfair Display"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-xl": ["40px", { "lineHeight": "48px", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #fcf8f2; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="font-body-md text-on-background min-h-screen relative overflow-hidden">
<!-- Mock Background Content (to show overlay effect) -->
<div class="absolute inset-0 z-0 p-container-margin opacity-30 pointer-events-none">
<div class="w-full h-48 bg-white rounded-lg shadow-md mb-stack-lg"></div>
<div class="w-full h-64 bg-white rounded-lg shadow-md"></div>
</div>
<!-- Full-screen Modal Overlay -->
<div class="fixed inset-0 z-40 bg-background/90 backdrop-blur-sm flex flex-col justify-center items-center px-container-margin">
<!-- Compass Container -->
<div class="flex flex-col items-center justify-center space-y-stack-lg flex-grow">
<!-- Large Dark Green Arrow -->
<div class="relative w-48 h-48 flex items-center justify-center animate-pulse">
<!-- Outer subtle ring -->
<div class="absolute inset-0 border-4 border-primary/10 rounded-full"></div>
<!-- Inner ring -->
<div class="absolute inset-4 border-2 border-primary/20 rounded-full"></div>
<!-- The Arrow -->
<span class="material-symbols-outlined text-9xl text-primary transform -rotate-45" style="font-size: 120px;">
                    navigation
                </span>
</div>
<!-- Distance Text -->
<div class="text-center">
<h1 class="font-headline-xl text-headline-xl text-primary mb-stack-sm tracking-tight">
                    45
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant uppercase tracking-widest font-semibold">
                    Meters Away
                </p>
</div>
</div>
<!-- Close Action -->
<div class="w-full max-w-sm pb-[100px]"> <!-- Padding bottom to account for BottomNavBar -->
<button class="w-full py-4 bg-primary-container text-on-primary rounded-3xl font-label-md text-label-md uppercase shadow-lg hover:bg-primary transition-colors active:scale-95 duration-200">
                Close Compass
            </button>
</div>
</div>
<!-- BottomNavBar (Shared Component) -->
<nav class="fixed bottom-6 left-0 right-0 mx-auto z-50 flex justify-around items-center px-6 py-3 max-w-md bg-primary/90 backdrop-blur-md w-[calc(100%-48px)] rounded-full shadow-lg">
<a class="flex items-center justify-center bg-secondary text-on-secondary rounded-full w-12 h-12 shadow-md hover:scale-110 transition-transform active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="explore" data-weight="fill">explore</span>
</a>
<a class="flex items-center justify-center text-white/70 w-12 h-12 hover:scale-110 transition-transform active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="explore_nearby">explore_nearby</span>
</a>
<a class="flex items-center justify-center text-white/70 w-12 h-12 hover:scale-110 transition-transform active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="leaderboard">leaderboard</span>
</a>
</nav>
<script>
        // Subtle interaction for the compass
        const arrow = document.querySelector('.material-symbols-outlined.text-9xl');
        window.addEventListener('deviceorientation', (e) => {
            if (e.alpha !== null) {
                // Simplified logic just to show some movement if device orientation is supported
                const rotation = e.alpha; 
                arrow.style.transform = `rotate(${rotation}deg)`;
            }
        });
    </script>
</body></html>
