            animation: pulse 2s infinite ease-in-out;

<body class="antialiased min-h-screen pb-32">
<!-- TopAppBar Semantic Shell -->
<header class="flex justify-between items-center px-container-margin py-4 w-full bg-surface dark:bg-primary-container shadow-md docked full-width top-0 z-40 hidden md:flex">
<button class="flex items-center justify-center text-on-surface-variant dark:text-on-primary-fixed-variant hover:opacity-80 transition-opacity scale-95 active:transition-transform">

<div class="text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-primary-fixed italic font-bold">EJAS26</h1>
</div>
<button class="flex items-center justify-center text-on-surface-variant dark:text-on-primary-fixed-variant hover:opacity-80 transition-opacity scale-95 active:transition-transform">

</div>

<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                Enter a room code or scan the QR code to join your team.
            </p>
</div>
<!-- Input Card -->
<div class="bg-surface-container-lowest rounded-xl ambient-shadow-md p-6 flex flex-col gap-stack-md">
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-primary uppercase" for="roomId">Room ID</label>
<input class="brand-input w-full px-4 py-3 rounded-lg font-body-lg text-body-lg text-primary placeholder:text-outline-variant text-center tracking-[0.2em]" id="roomId" maxlength="6" placeholder="Enter 6-digit code" type="text">
</div>
<button class="w-full bg-[#d97736] text-surface-container-lowest font-label-md text-label-md uppercase py-4 rounded-3xl hover:opacity-90 transition-opacity shadow-md flex items-center justify-center gap-unit">
                Join Room

</button>
</div>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="h-px bg-outline-variant/30 flex-1"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">OR</span>
<div class="h-px bg-outline-variant/30 flex-1"></div>
</div>
<!-- Scan QR Section -->
<div class="bg-surface-container-lowest rounded-xl ambient-shadow-md p-6 flex items-center justify-between">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-primary">Scan QR Code</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Use your camera</span>
</div>
<button class="w-12 h-12 bg-[#283b31] rounded-full flex items-center justify-center text-surface-container-lowest shadow-md hover:scale-105 transition-transform">

<script>

        input.addEventListener('input', function() {
            this.value = this.value.toUpperCase();
