<body class="font-body-md text-body-md text-on-background min-h-screen pb-32">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-primary-container shadow-md sticky top-0 z-40 w-full flex justify-between items-center px-container-margin py-4">
<button aria-label="Menu" class="text-on-surface-variant hover:opacity-80 transition-opacity scale-95 active:transition-transform">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-primary-fixed italic">EJAS26</h1>
<button aria-label="Profile" class="text-on-surface-variant hover:opacity-80 transition-opacity scale-95 active:transition-transform">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</header>
<main class="px-container-margin pt-stack-lg max-w-2xl mx-auto space-y-stack-lg">
<!-- Mission Header -->
<section class="space-y-stack-sm text-center">
<div class="inline-block px-4 py-1 rounded-full bg-primary/10 text-primary font-label-sm text-label-sm uppercase mb-2">Desafio de Conhecimento</div>
<h2 class="font-headline-xl text-headline-xl text-primary">O Vale de Pedra</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto">Demonstre sua compreensão dos símbolos sagrados encontrados durante a exploração.</p>
</section>
<!-- Quiz Container -->
<section class="bg-surface-bright rounded-xl shadow-md p-6 space-y-stack-md border border-surface-variant/50 relative overflow-hidden">
<!-- Decorative Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-secondary"></div>
<div class="flex items-center space-x-3 mb-6">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="psychology">psychology</span>
</div>
<h3 class="font-headline-md text-headline-md text-primary">Questão 1</h3>
</div>
<p class="font-body-lg text-body-lg text-on-surface font-medium">Qual o significado do marco de pedra encontrado no vale?</p>
<div class="space-y-stack-sm pt-4">
<!-- Option 1 -->
<label class="block relative cursor-pointer group">
<input class="peer sr-only" name="quiz" type="radio">
<div class="p-4 rounded-lg border border-primary/20 bg-background/50 hover:bg-primary/5 transition-colors peer-checked:border-secondary peer-checked:bg-secondary/10 flex items-start space-x-4">
<div class="w-6 h-6 rounded-full border-2 border-primary/30 peer-checked:border-secondary flex-shrink-0 flex items-center justify-center mt-0.5">
<div class="w-3 h-3 rounded-full bg-secondary opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<span class="font-body-md text-body-md text-on-surface">Um antigo marcador de fronteira entre clãs locais.</span>
</div>
</label>
<!-- Option 2 -->
<label class="block relative cursor-pointer group">
<input class="peer sr-only" name="quiz" type="radio">
<div class="p-4 rounded-lg border border-primary/20 bg-background/50 hover:bg-primary/5 transition-colors peer-checked:border-secondary peer-checked:bg-secondary/10 flex items-start space-x-4">
<div class="w-6 h-6 rounded-full border-2 border-primary/30 peer-checked:border-secondary flex-shrink-0 flex items-center justify-center mt-0.5">
<div class="w-3 h-3 rounded-full bg-secondary opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<span class="font-body-md text-body-md text-on-surface">Um altar cerimonial usado para bênçãos de colheita.</span>
</div>
</label>
<!-- Option 3 -->
<label class="block relative cursor-pointer group">
<input class="peer sr-only" name="quiz" type="radio">
<div class="p-4 rounded-lg border border-primary/20 bg-background/50 hover:bg-primary/5 transition-colors peer-checked:border-secondary peer-checked:bg-secondary/10 flex items-start space-x-4">
<div class="w-6 h-6 rounded-full border-2 border-primary/30 peer-checked:border-secondary flex-shrink-0 flex items-center justify-center mt-0.5">
<div class="w-3 h-3 rounded-full bg-secondary opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<span class="font-body-md text-body-md text-on-surface">O ponto de convergência de linhas de energia naturais.</span>
</div>
</label>
</div>
<div class="pt-6">
<button class="w-full bg-secondary text-on-secondary font-label-md text-label-md rounded-full py-4 shadow-md hover:opacity-90 transition-opacity flex items-center justify-center space-x-2">
<span>Confirmar Resposta</span>
<span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</section>

<span class="material-symbols-outlined" data-icon="explore">explore</span>
</a>
