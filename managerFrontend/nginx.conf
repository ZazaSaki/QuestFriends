server {
    listen 80;
    server_name _;

    # Allow media uploads to pass through the proxy to MinIO.
    client_max_body_size 100m;

    # --- REST API → backend ---
    location /api/ {
        proxy_pass http://10.5.0.10:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Socket.io (WebSocket) → backend ---
    location /socket.io/ {
        proxy_pass http://10.5.0.10:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # --- MinIO media (bucket "scavenger") ---
    # Public objects render via GET; presigned PUT uploads validate because the
    # signed Host equals the request Host (kept via `Host $host`).
    location /scavenger/ {
        proxy_pass http://10.5.0.15:9000;
        # Forward the FULL host incl. port ($http_host, not $host which drops the
        # port) so the presigned-PUT signature (signed for this host) validates.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
    }

    # --- SPA (React Router fallback) ---
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
