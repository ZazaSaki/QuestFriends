version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      backend_net:
        ipv4_address: 10.5.0.5

  app:
    build: ./scavenger
    restart: always
    ports:
      # Loopback-only: cloudflared runs on the host and the manager's nginx
      # reaches the backend in-network. Nothing here needs a LAN-facing bind.
      - "127.0.0.1:9101:3000"
    environment:
      # Postgres Variables
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@10.5.0.5:5432/${POSTGRES_DB}?schema=public
      PORT: 3000
      
      # How the Node app talks to MinIO (Internal)
      MINIO_INTERNAL_ENDPOINT: 10.5.0.15
      MINIO_INTERNAL_PORT: 9000

      # The URL the Node app gives to the player's phone / browser (External).
      # Must be reachable from wherever the client runs — localhost for local QA,
      # or your server IP / domain in production.
      MINIO_EXTERNAL_URL: ${MINIO_URL}

      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}

      # Room janitor (background cleanup) — defaults shown; uncomment to tune.
      # ROOM_GC_ENABLED: "true"
      # ROOM_GC_INTERVAL_MS: "60000"       # how often the sweep runs
      # ROOM_GC_EMPTY_MINUTES: "10"        # delete empty rooms older than this
      # ROOM_MAX_AGE_HOURS: "3"            # ping rooms older than this
      # ROOM_LIVENESS_RECHECK_MINUTES: "60"  # if alive, recheck after this
      # ROOM_LIVENESS_TIMEOUT_MS: "5000"   # how long to wait for a pong
    depends_on:
      - db
      - minio
    networks:
      backend_net:
        ipv4_address: 10.5.0.10

  minio:
    image: minio/minio:latest
    restart: always
    ports:
      - "127.0.0.1:9110:9000" # MinIO API Port (used by your Node app)
      - "127.0.0.1:9111:9001" # MinIO Web Console — loopback only, never tunnel it
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      backend_net:
        ipv4_address: 10.5.0.15

  frontend:
    build: ./frontend
    restart: always
    ports:
      # server.js is Express on :3000 (see frontend/Dockerfile), not nginx on :80.
      - "127.0.0.1:9112:3000" # Player / staff UI (open http://localhost:9112)
    volumes:
      # Static assets — edit under ./frontend and just refresh, no rebuild.
      # Only css/ and js/ are mounted: binding all of /app would shadow the
      # node_modules installed at image build time.
      - ./frontend/css:/app/css:ro
      - ./frontend/js:/app/js:ro
    environment:
      PORT: 3000
      # Injected into the page as window.__DEFAULT_API_BASE__ (see
      # frontend/server.js). Must be an address the PLAYER'S browser can reach,
      # not a Docker/loopback address. Cross-origin is fine: the backend sets
      # `cors()` open and Socket.io `origin: "*"`.
      PUBLIC_BACKEND_URL: ${PUBLIC_API_URL}
    depends_on:
      - app
    networks:
      backend_net:
        ipv4_address: 10.5.0.20

  manager:
    build:
      context: ./managerFrontend
      args:
        # Same-origin: the SPA calls /api and /socket.io on its own host and this
        # container's nginx reverse-proxies them to the backend & MinIO. Works
        # locally and behind a single Cloudflare tunnel (no CORS/mixed-content).
        VITE_API_URL: ""
        VITE_SOCKET_URL: ""
    restart: always
    ports:
      # Loopback only — this is the single origin the Cloudflare tunnel points at.
      - "127.0.0.1:9113:80" # Manager UI (open http://localhost:9113)
    depends_on:
      - app
    networks:
      - backend_net

  # tester:
  #   build: ./tester
  #   restart: "no"
  #   ports:
  #     # Loopback only — god-mode QA dashboard, no auth. Never tunnel it.
  #     - "127.0.0.1:9121:3000" # Manual QA dashboard (open http://localhost:9121)
  #   environment:
  #     PORT: 3000
  #     # In-Docker-network address the test-runner uses to reach the backend.
  #     BACKEND_HTTP: http://10.5.0.10:3000
  #     # Host-mapped URL the browser-based dashboard should use for the backend.
  #     PUBLIC_BACKEND_URL: ${BACKEND_URL}
  #   volumes:
  #     # Drop test media into ./tester/assets and it is served live (no rebuild).
  #     - ./tester/assets:/app/assets
  #   depends_on:
  #     - app
  #   networks:
  #     - backend_net

volumes:
  pgdata:
  minio_data:

networks:
  backend_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16
