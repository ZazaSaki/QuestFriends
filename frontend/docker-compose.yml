version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      backend_net:
        ipv4_address: 10.5.0.5

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "9105:3000"
    environment:
      PORT: 3000
      # URL que o BROWSER do utilizador vai usar para falar com o backend —
      # localhost para testes locais, ou o IP/domínio público em produção.
      PUBLIC_BACKEND_URL: http://localhost:9101
    depends_on:
      - app
    networks:
      - backend_net

  managerfrontend:
    build:
      context: ./managerFrontend
      args:
        VITE_API_URL: http://localhost:9101
        VITE_SOCKET_URL: http://localhost:9101
    restart: always
    ports:
      - "9106:80"
    depends_on:
      - app
    networks:
      - backend_net

  app:
    build: ./scavenger
    restart: always
    ports:
      - "9101:3000"
    environment:
      # Postgres Variables
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@10.5.0.5:5432/${POSTGRES_DB}?schema=public
      PORT: 3000
      
      # How the Node app talks to MinIO (Internal)
      MINIO_INTERNAL_ENDPOINT: 10.5.0.15
      MINIO_INTERNAL_PORT: 9000

      # The URL the Node app gives to the player's phone / browser (External).
      # Must be reachable from wherever the client runs — localhost for local QA,
      # or your server IP / domain in production.
      MINIO_EXTERNAL_URL: http://localhost:9110

      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
    depends_on:
      - db
      - minio
    networks:
      backend_net:
        ipv4_address: 10.5.0.10

  minio:
    image: minio/minio:latest
    restart: always
    ports:
      - "9110:9000" # MinIO API Port (used by your Node app)
      - "9111:9001" # MinIO Web Console (for you to view files in your browser)
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      backend_net:
        ipv4_address: 10.5.0.15

volumes:
  pgdata:
  minio_data:

networks:
  backend_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16